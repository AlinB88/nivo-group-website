<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="NIVO is a developing group experience built around thoughtful business guidance."
    />
    <meta name="theme-color" content="#050915" />
    <title>NIVO Group — A clearer way forward</title>
  </head>
  <body data-wardrobe="base" data-chapter="hero">
    <a class="skip-link" href="#chapters">Skip to chapters</a>

    <header class="site-header" data-header>
      <p class="header-status"><i aria-hidden="true"></i> In development</p>
      <a class="wordmark" href="#top" aria-label="NIVO Group home">NIVO</a>
      <div class="header-actions">
        <button class="language-switch" type="button" data-language-switch></button>
        <p class="header-chapter" data-header-chapter>01 / 04</p>
      </div>
    </header>

    <main id="top">
      <section class="scene-shell" aria-label="NIVO character progression">
        <div class="scene-shell__backdrop" aria-hidden="true"></div>
        <div class="scene-shell__grain" aria-hidden="true"></div>
        <div class="scene-motifs" aria-hidden="true">
          <img
            class="scene-motif scene-motif--base"
            src="/assets/decor/base-origin.svg"
            alt=""
          />
          <img
            class="scene-motif scene-motif--advisor"
            src="/assets/decor/advisor-orbit.svg"
            alt=""
          />
          <img
            class="scene-motif scene-motif--it"
            src="/assets/decor/it-circuit.svg"
            alt=""
          />
          <img
            class="scene-motif scene-motif--logistics"
            src="/assets/decor/logistics-routes.svg"
            alt=""
          />
        </div>
        <div class="scene-particles" aria-hidden="true">
          <i style="--x: 12%; --y: 21%; --s: 0.32rem; --d: -3s"></i>
          <i style="--x: 31%; --y: 75%; --s: 0.2rem; --d: -7s"></i>
          <i style="--x: 48%; --y: 17%; --s: 0.44rem; --d: -11s"></i>
          <i style="--x: 67%; --y: 27%; --s: 0.25rem; --d: -5s"></i>
          <i style="--x: 78%; --y: 70%; --s: 0.36rem; --d: -9s"></i>
          <i style="--x: 91%; --y: 37%; --s: 0.18rem; --d: -2s"></i>
        </div>

        <div class="scene-shell__content">
          <p class="scene-kicker" data-scene-kicker></p>
          <p class="scene-caption" data-scene-caption></p>
          <div class="nivo-stage" aria-hidden="true">
            <div class="nivo-stage__halo"></div>
            <div class="nivo-stage__floor"></div>
            <img
              class="nivo-render nivo-render--base"
              src="/assets/nivo/nivo-base-cutout.png"
              alt=""
              width="1280"
              height="1280"
              fetchpriority="high"
            />
            <img
              class="nivo-render nivo-render--advisor"
              src="/assets/nivo/nivo-advisor-cutout.png"
              alt=""
              width="1254"
              height="1254"
            />
            <img
              class="nivo-render nivo-render--it"
              src="/assets/nivo/nivo-it-cutout.png"
              alt=""
              width="1254"
              height="1254"
            />
            <img
              class="nivo-render nivo-render--logistics"
              src="/assets/nivo/nivo-logistics-cutout.png"
              alt=""
              width="1254"
              height="1254"
            />
          </div>
          <div class="scene-shell__meta" aria-hidden="true">
            <span data-scene-number>01</span
            ><span class="scene-progress"><i data-scene-progress></i></span
            ><span>04</span>
          </div>
        </div>
      </section>

      <div id="chapters" class="chapters" data-chapters></div>
    </main>

    <footer class="site-footer" data-footer></footer>
    <script type="module" src="/main.js"></script>
  </body>
</html>
